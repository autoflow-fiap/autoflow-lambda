name: Lambda CI

on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

permissions:
  contents: read
  actions: read

jobs:
  checks:
    name: CI Lambda Python e Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Testes Python, guards e matriz dos workflows
        run: |
          python -m unittest test_handler test_http_api -v
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Auditar dependências
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Validar pacote Lambda
        run: bash ./build.sh
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
      - name: Terraform init sem backend
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra validate
